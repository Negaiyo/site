<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ты не хочешь прийти сегодня ко мне?</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="page-index">
    <main class="card">
        <h1 class="question">Ты не хочешь прийти сегодня ко мне?</h1>

        <div class="actions">
            <a class="btn btn-yes" href="{% url 'yes' %}">Да</a>
            <button class="btn btn-no" id="noButton" type="button">Нет</button>
        </div>

        <p class="hint">Нажми «Нет» — она убежит 😉</p>
    </main>

    <script src="{% static 'js/no-button.js' %}"></script>
</body>
</html>
